databases:
  - name: wholesomebasket-db
    databaseName: wholesomebasket
    plan: free

services:
  - type: web
    name: wholesomebasket
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn wholefoods.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wholesomebasket-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.12.3
